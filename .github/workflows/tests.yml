name: Python Testing CI

on:
  push:
    branches:
      - '**'        # Matches every branch (feature branches, hotfixes, etc.)
  pull_request:
    branches:
      - '**'        # Runs tests for PRs targeting any branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio

    - name: Run tests with pytest
      env:
        # Provide dummy values so Pydantic doesn't crash during initialization
        SUPABASE_URL: "https://mock.supabase.co"
        SUPABASE_SERVICE_KEY: "mock-service-key"
        DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        MXBAI_API_KEY: "mock-key"
        # Include these because your error log listed them as missing too
        SUPABASE_JWT_SECRET: "mock-secret"
        BACKEND_URL: "http://localhost:8000"
        FRONTEND_URL: "http://localhost:3000"
      run: |
        pytest
