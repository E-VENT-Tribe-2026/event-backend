name: Python Testing CI

on:
  push:
    branches:
      - '**'        # Matches every branch (feature branches, hotfixes, etc.)
  pull_request:
    branches:
      - '**'        # Runs tests for PRs targeting any branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio

    - name: Run tests with pytest
      env:
        # URL must be a valid-looking URL
        SUPABASE_URL: "https://ididimlxgu.supabase.co" 
        
        # KEY must look like a JWT (three parts separated by dots)
        # This is a fake key, but it follows the required format
        SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkZWRpbWx4Z3UiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYyMDY4MTYwMCwiZXhwIjoyNTI0NjA4MDAwfQ.mock-signature"
        
        # These can stay as they were
        DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        SUPABASE_SERVICE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.mock-signature"
        SUPABASE_JWT_SECRET: "mock-secret-at-least-32-characters-long"
        BACKEND_URL: "http://localhost:8000"
        FRONTEND_URL: "http://localhost:3000"
        MXBAI_API_KEY: "mock-key"
      run: |
        pytest
