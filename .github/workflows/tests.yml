name: Python Testing CI

on:
  push:
    branches:
      - '**'        # Matches every branch (feature branches, hotfixes, etc.)
  pull_request:
    branches:
      - '**'        # Runs tests for PRs targeting any branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio

    - name: Run tests with pytest
      env:
        # These allow the app to initialize without crashing
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'mock-key' }}
        OPENAI_API_KEY: "mock-key"
      run: |
        pytest