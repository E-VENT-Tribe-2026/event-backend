name: Add Issue to Project
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add item to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/EVENT-Tribe-2026/projects/
          github-token: ${{ secrets.ADD_TO_PROJECT_BOARD }}
