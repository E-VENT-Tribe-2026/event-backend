# Constructor Studio artifacts registry

[[systems]]
name = "EventBackend"
slug = "eventbackend"
kit = "sdlc"
artifacts_dir = "docs/architecture"

[[systems.codebase]]
name = "Backend Application"
path = "app"
extensions = [".py"]

[[systems.codebase]]
name = "Database Migrations"
path = "supabase/migrations"
extensions = [".sql"]

[[systems.codebase]]
name = "Backend Tests"
path = "tests"
extensions = [".py"]

[[systems.artifacts]]
name = "Database Migration Ordering ADR"
path = "docs/architecture/ADR/ADR-001-database-migrations-ordering.md"
kind = "ADR"
traceability = "FULL"
