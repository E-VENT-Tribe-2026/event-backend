</script>
<style>
/* cfs map viewer — 3-column layout */

:root {
  --inspector-width: 320px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  background: #f4f4f6;
  color: #1a1a2e;
}

#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar (left, 240px) ── */
#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: #1a1a2e;
  color: #e0e0f0;
  padding: 12px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: width 0.18s ease, padding 0.18s ease;
}

#sidebar.collapsed {
  width: 0;
  min-width: 0;
  padding-left: 0;
  padding-right: 0;
  overflow: hidden;
}

#sidebar.no-anim {
  transition: none;
}

#sidebar h2 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #9090bb;
  margin: 0 0 4px 0;
}

#sidebar .logo {
  font-size: 14px;
  font-weight: 800;
  color: #a0c4ff;
  letter-spacing: 0.04em;
  padding-bottom: 8px;
  border-bottom: 1px solid #2d2d50;
}

.stat-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 6px;
  border-radius: 4px;
  cursor: default;
}

.stat-row:hover {
  background: #2d2d50;
}

.stat-row .label {
  color: #c0c0e0;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-row .count {
  font-size: 11px;
  font-weight: 700;
  background: #2d2d50;
  color: #a0c4ff;
  border-radius: 9px;
  padding: 1px 7px;
  min-width: 24px;
  text-align: center;
}

.stat-row.danger .count {
  background: #4a1010;
  color: #ff8080;
}

.stat-row.clickable {
  cursor: pointer;
}

.stat-row.clickable:hover .count {
  background: #c41212;
  color: #fff;
}

.stat-row.active {
  background: #2d2d50;
  outline: 1px solid #6080ff;
}

.stat-row.active .label {
  color: #a0c4ff;
}

.stat-row.active .count {
  background: #4060c0;
  color: #fff;
}

/* Per-type active colors for edge-toggle rows */
.stat-row.edge-toggle .label::before {
  content: "";
  display: inline-block;
  width: 12px; height: 3px;
  margin-right: 6px;
  background: currentColor;
  opacity: 0.45;
  vertical-align: middle;
}
.stat-row.edge-toggle-cpt-doc .label   { color: #4060c0; }
.stat-row.edge-toggle-cpt-impl .label  { color: #20a060; }
.stat-row.edge-toggle-file-link .label { color: #888888; }

.stat-row.edge-toggle.active .label::before { opacity: 1; }
.stat-row.edge-toggle-cpt-doc.active   { background: rgba(64, 96, 192, 0.18); outline-color: #4060c0; }
.stat-row.edge-toggle-cpt-impl.active  { background: rgba(32, 160, 96, 0.18); outline-color: #20a060; }
.stat-row.edge-toggle-file-link.active { background: rgba(136, 136, 136, 0.22); outline-color: #aaaaaa; }
.stat-row.edge-toggle.active .label    { color: #fff; }
.stat-row.edge-toggle.active .count    {
  background: transparent; color: inherit;
  border: 1px solid currentColor;
}

/* Per-kind active colors for node-toggle rows */
.stat-row.node-toggle .label::before {
  content: "■";
  display: inline-block;
  width: 12px;
  margin-right: 6px;
  color: currentColor;
  opacity: 0.55;
  vertical-align: middle;
}
.stat-row.node-toggle-markdown .label    { color: #7744cc; }
.stat-row.node-toggle-source .label      { color: #c07000; }
.stat-row.node-toggle-phantom-cpt .label { color: #c41212; }

.stat-row.node-toggle.active .label::before { opacity: 1; }
.stat-row.node-toggle-markdown.active    { background: rgba(119, 68, 204, 0.18); outline-color: #7744cc; }
.stat-row.node-toggle-source.active      { background: rgba(192, 112, 0, 0.20); outline-color: #c07000; }
.stat-row.node-toggle-phantom-cpt.active { background: rgba(196, 18, 18, 0.18); outline-color: #c41212; }
.stat-row.node-toggle.active .label      { color: #fff; }
.stat-row.node-toggle.active .count      {
  background: transparent; color: inherit;
  border: 1px solid currentColor;
}

.stat-hint {
  font-size: 10px;
  color: #888;
  padding: 2px 6px 4px;
  font-style: italic;
}

/* Search box */
#search-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#search-input {
  width: 100%;
  padding: 5px 8px;
  background: #2d2d50;
  border: 1px solid #4040aa;
  border-radius: 5px;
  color: #e0e0f0;
  font-size: 12px;
  outline: none;
}

#search-input:focus {
  border-color: #80a0ff;
}

#search-results {
  font-size: 11px;
  color: #9090bb;
  min-height: 14px;
}

/* ── Sidebar toggle button ── */
#sidebar-toggle {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 4;
  width: 28px;
  height: 28px;
  font-size: 16px;
  line-height: 1;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #d0d0e0;
  border-radius: 6px;
  color: #334;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  padding: 0;
}

#sidebar-toggle:hover {
  background: #eef0fa;
  border-color: #c0c8e0;
  color: #3050a0;
}

#sidebar-toggle:focus {
  outline: 2px solid #3050a0;
  outline-offset: 2px;
}

/* ── Graph (center, fills) ── */
#graph-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
  display: flex;
}
#graph {
  flex: 1;
  background: #f9f9fb;
  position: relative;
  overflow: hidden;
}

/* ── Toolbar (top-right of graph) ── */
#toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 5;
  display: flex;
  gap: 2px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #d0d0e0;
  border-radius: 6px;
  padding: 3px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}
#toolbar button {
  width: 28px; height: 28px;
  font-size: 14px;
  line-height: 1;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #334;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#toolbar button:hover:not(:disabled) {
  background: #eef0fa;
  border-color: #c0c8e0;
  color: #3050a0;
}
#toolbar button:disabled {
  color: #bbb;
  cursor: not-allowed;
}
#toolbar button.active {
  background: #3050a0;
  border-color: #3050a0;
  color: #fff;
}
#toolbar button.active:hover { background: #4060c0; color: #fff; }

/* Hand-tool transparent overlay — captures pointer events while active. */
#hand-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 4;            /* above canvas, below toolbar (z-index 5) */
  pointer-events: none;
  cursor: grab;
}
#hand-overlay.active { pointer-events: auto; }
#hand-overlay.active.grabbing,
#graph-wrap.hand-mode.grabbing { cursor: grabbing; }
#graph-wrap.hand-mode #hand-overlay { cursor: grab; }
#graph-wrap.hand-mode #hand-overlay.grabbing { cursor: grabbing; }

/* ── Inspector (right, variable width, hidden by default) ── */
#inspector {
  width: var(--inspector-width, 320px);
  flex-shrink: 0;
  background: #fff;
  border-left: 1px solid #dde;
  padding: 0;
  overflow-y: auto;
  transform: translateX(var(--inspector-width, 320px));
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
  z-index: 10;
  position: relative;
}

#inspector.open {
  transform: translateX(0);
}

/* ── Inspector resize handle ── */
#inspector-resize-handle {
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 100%;
  cursor: col-resize;
  z-index: 11;
  pointer-events: none;
}

#inspector.open #inspector-resize-handle {
  pointer-events: auto;
}

#inspector-resize-handle:hover {
  background: rgba(48, 80, 160, 0.18);
}

#inspector-header {
  padding: 10px 14px;
  background: #f0f0fa;
  border-bottom: 1px solid #dde;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#inspector-header .kind-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 2px 8px;
  border-radius: 10px;
  color: #fff;
}

.kind-badge.markdown  { background: #4060c0; }
.kind-badge.source    { background: #c07000; }
.kind-badge.phantom-cpt { background: #c41212; }
.kind-badge.edge      { background: #606060; }

#inspector-close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #888;
  line-height: 1;
  padding: 0 2px;
}

#inspector-close:hover {
  color: #333;
}

#inspector-body {
  padding: 12px 14px;
  flex: 1;
  overflow-y: auto;
}

#inspector-body h3 {
  font-size: 12px;
  font-weight: 700;
  margin: 12px 0 4px 0;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

#inspector-body h3:first-child {
  margin-top: 0;
}

#inspector-body p {
  margin: 3px 0;
  word-break: break-all;
  line-height: 1.45;
}

#inspector-body .field-label {
  color: #888;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

#inspector-body code {
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  font-size: 11px;
  background: #f0f0f8;
  border-radius: 3px;
  padding: 1px 5px;
}

.content-block {
  background: #f7f7fa;
  border-left: 3px solid #c0c8f0;
  border-radius: 0 4px 4px 0;
  padding: 6px 10px;
  font-size: 11px;
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  color: #334;
  margin-top: 4px;
}

.ref-card {
  background: #f7f7fa;
  border: 1px solid #e0e0ee;
  border-radius: 5px;
  padding: 6px 10px;
  margin: 4px 0;
  font-size: 11px;
}

.ref-card .cpt-id {
  font-weight: 700;
  color: #3050a0;
}

.ref-card .snippet {
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  color: #555;
}

/* Markdown-rendered snippets (override the monospace look for prose) */
.snippet.md, .content-block.md {
  font-family: inherit;
  white-space: normal;
  word-break: normal;
}
.snippet.md p, .content-block.md p { margin: 4px 0; }
.snippet.md ul, .snippet.md ol, .content-block.md ul, .content-block.md ol { margin: 4px 0 4px 16px; padding: 0; }
.snippet.md li, .content-block.md li { margin: 2px 0; }
.snippet.md code, .content-block.md code {
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  background: rgba(0,0,0,0.06);
  border-radius: 3px;
  padding: 0 3px;
  font-size: 10.5px;
}
.snippet.md pre, .content-block.md pre {
  background: #f0f0f6;
  border-radius: 3px;
  padding: 6px 8px;
  overflow-x: auto;
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  font-size: 10.5px;
}
.snippet.md pre code, .content-block.md pre code { background: transparent; padding: 0; }
.snippet.md h1, .snippet.md h2, .snippet.md h3, .snippet.md h4,
.content-block.md h1, .content-block.md h2, .content-block.md h3, .content-block.md h4 {
  margin: 8px 0 4px; font-size: 12px; font-weight: 700;
}
.snippet.md a, .content-block.md a { color: #3050a0; text-decoration: none; }
.snippet.md a:hover, .content-block.md a:hover { text-decoration: underline; }
.snippet.md table, .content-block.md table { border-collapse: collapse; margin: 4px 0; }
.snippet.md th, .snippet.md td, .content-block.md th, .content-block.md td {
  border: 1px solid #d0d0d8; padding: 2px 6px; font-size: 10.5px;
}
.snippet.md blockquote, .content-block.md blockquote {
  border-left: 3px solid #c0c8f0; padding-left: 8px; color: #557; margin: 4px 0;
}
.snippet.code, .content-block.code {
  /* Source code preserves whitespace */
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  white-space: pre;
  overflow-x: auto;
  margin: 4px 0;
  background: #f0f0f6;
  border-radius: 3px;
  padding: 6px 8px;
  font-size: 10.5px;
}
.muted { color: #888; font-style: italic; font-size: 10.5px; }

/* Collapsible snippet:
 *   .snippet-wrap        container; never clipped
 *   .snippet-clip        the only element with overflow:hidden + max-height
 *   .snippet-toggle      sibling of the clip → always clickable */
.snippet-wrap { position: relative; margin-top: 4px; }
.snippet-wrap > .snippet,
.snippet-wrap > .content-block,
.snippet-clip > .snippet,
.snippet-clip > .content-block { margin-top: 0; }

.snippet-clip {
  position: relative;
}
.snippet-clip.collapsed {
  max-height: 5.6em;   /* ≈ 4 lines at line-height 1.4 */
  overflow: hidden;
}
.snippet-clip.expanded {
  max-height: none;
}

.snippet-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 26px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(247,247,250,0), rgba(247,247,250,0.95));
}
.snippet-clip.expanded .snippet-fade { display: none; }

.snippet-toggle {
  display: inline-block;
  margin-top: 4px;
  padding: 1px 8px;
  font-size: 10px;
  font-family: inherit;
  background: #eef0fa;
  border: 1px solid #c0c8e0;
  border-radius: 3px;
  color: #3050a0;
  cursor: pointer;
}
.snippet-toggle:hover { background: #dde2f5; }

/* Clickable cpt-ID chip rows: text navigates, ⌖ toggles as filter */
.cpt-id-row {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.cpt-id.link, .cpt-link {
  cursor: pointer;
  border-bottom: 1px dotted #3050a0;
}
.cpt-id.link:hover, .cpt-link:hover { background: rgba(48, 80, 160, 0.10); }
.cpt-id.link::after { content: " ↗"; font-weight: 400; opacity: 0.6; }

.cpt-filter-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  padding: 0;
  font-size: 11px;
  line-height: 1;
  background: transparent;
  border: 1px solid #c0c8e0;
  border-radius: 3px;
  color: #888;
  cursor: pointer;
}
.cpt-filter-toggle:hover { background: #eef0fa; color: #3050a0; }
.cpt-filter-toggle.active {
  background: #3050a0;
  color: #fff;
  border-color: #3050a0;
}

.cpt-view-toggle {
  margin-left: 6px;
  padding: 1px 6px;
  font-size: 10px;
  line-height: 1.4;
  background: transparent;
  border: 1px solid #c0c8e0;
  border-radius: 3px;
  color: #557;
  cursor: pointer;
  user-select: none;
}
.cpt-view-toggle:hover { background: #eef0fa; color: #3050a0; border-color: #3050a0; }

.ref-card .snippet-wrap { margin-top: 4px; }

/* Inline cpt-id references in rendered markdown content */
.cpt-inline-ref {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  vertical-align: baseline;
}
.cpt-id.inline {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9em;
  padding: 1px 5px;
  background: rgba(48, 80, 160, 0.06);
  border-radius: 3px;
  color: #3050a0;
}
.cpt-id.inline:hover { background: rgba(48, 80, 160, 0.14); }
.cpt-inline-expand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px; height: 16px;
  padding: 0;
  font-size: 11px;
  line-height: 1;
  background: transparent;
  border: 1px solid #c0c8e0;
  border-radius: 3px;
  color: #557;
  cursor: pointer;
  user-select: none;
}
.cpt-inline-expand:hover { background: #eef0fa; color: #3050a0; border-color: #3050a0; }
.cpt-inline-panel {
  margin: 6px 0 8px;
  padding: 8px 10px;
  background: #f8f9fc;
  border-left: 3px solid #c0c8f0;
  border-radius: 0 3px 3px 0;
}

/* Active cpt filter panel in sidebar */
#cpt-filter-section.empty { display: none; }
#cpt-filter-section h2 { color: #3050a0; }
.filter-chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 4px 0;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  background: #3050a0;
  color: #fff;
  border-radius: 10px;
  padding: 2px 4px 2px 8px;
  gap: 2px;
}
.filter-chip-remove {
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 0 2px;
}
.filter-chip-remove:hover { color: #fff; }
.filter-clear {
  display: inline-block;
  margin-top: 4px;
  padding: 1px 8px;
  font-size: 10px;
  background: transparent;
  border: 1px solid #c0c8e0;
  border-radius: 3px;
  color: #555;
  cursor: pointer;
}
.filter-clear:hover { background: #eef0fa; color: #3050a0; }

/* Flash-highlight when scrolling to a card from cpt navigation */
.ref-card.flash-highlight {
  animation: flash-bg 1.5s ease-out;
  outline: 2px solid #ffc940;
}
@keyframes flash-bg {
  0%   { background: #fff5d2; }
  100% { background: #f7f7fa; }
}

/* Internal markdown link (resolves to a known node) */
.internal-md-link {
  color: #3050a0;
  cursor: pointer;
  border-bottom: 1px dotted #3050a0;
  text-decoration: none;
}
.internal-md-link:hover {
  background: rgba(48, 80, 160, 0.10);
}

/* Popup picker for "defined" cpt-id → list of users */
.cpt-picker {
  margin-top: 4px;
  border: 1px solid #d0d0e0;
  background: #fff;
  border-radius: 4px;
  padding: 4px;
  max-height: 220px;
  overflow-y: auto;
}
.cpt-picker .picker-item {
  display: block;
  padding: 4px 6px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  color: #334;
}
.cpt-picker .picker-item:hover { background: #eef0fa; }
.cpt-picker .picker-item .kind {
  display: inline-block;
  font-size: 9px;
  text-transform: uppercase;
  padding: 1px 4px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}
.cpt-picker .picker-item .kind.markdown { background: rgba(119,68,204,0.18); color: #4d2080; }
.cpt-picker .picker-item .kind.source   { background: rgba(192,112,0,0.20);  color: #804600; }
.cpt-picker .empty { padding: 4px 6px; color: #888; font-style: italic; font-size: 10.5px; }

/* ── Edge color tokens ── */
.edge-token {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}

.edge-cpt-doc  { background: #4060c0; }
.edge-cpt-impl { background: #20a060; }
.edge-file-link { background: #888888; }
.edge-dangling  { background: #c41212; }

/* ── Depth control ── */
.depth-control {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 6px 6px;
  background: #22223a;
  border-radius: 5px;
  border: 1px solid #3a3a66;
}

.depth-control label {
  color: #c0c0e0;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.depth-control small {
  color: #7070a0;
  font-size: 10px;
}

#depth-input {
  width: 52px;
  padding: 2px 6px;
  background: #2d2d50;
  border: 1px solid #4040aa;
  border-radius: 4px;
  color: #e0e0f0;
  font-size: 12px;
  outline: none;
}

#depth-input:focus {
  border-color: #80a0ff;
}

/* ── Scrollbar tweaks ── */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #bbb;
  border-radius: 3px;
}

#sidebar::-webkit-scrollbar-thumb {
  background: #444;
}

        {
          "cpt_id": "cpt-eventbackend-adr-database-migration-ordering",
          "line": 57,
          "snippet": "### 1.2 Architecture Drivers\n\nThe architecture is driven by the three assistant capabilities, authenticated per-user access, event visibility rules, schema-valid tool contracts, safe draft behavior, and traceable conversation orchestration.\n\n**ADRs:**\n\n- `cpt-eventbackend-adr-database-migration-ordering` — Database migration ordering strategy.\n- `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons` — Suspension protection and cancellation-reason handling.\n- `cpt-eventbackend-adr-caller-identity-blocking` — Caller identity and blocking visibility.\n\nThese ADRs document decisions relevant to the architecture drivers and should be reviewed alongside this design before sign-off.",
          "marker_kind": "md-ref"
        },
        {
          "cpt_id": "cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons",
          "line": 58,
          "snippet": "### 1.2 Architecture Drivers\n\nThe architecture is driven by the three assistant capabilities, authenticated per-user access, event visibility rules, schema-valid tool contracts, safe draft behavior, and traceable conversation orchestration.\n\n**ADRs:**\n\n- `cpt-eventbackend-adr-database-migration-ordering` — Database migration ordering strategy.\n- `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons` — Suspension protection and cancellation-reason handling.\n- `cpt-eventbackend-adr-caller-identity-blocking` — Caller identity and blocking visibility.\n\nThese ADRs document decisions relevant to the architecture drivers and should be reviewed alongside this design before sign-off.",
          "marker_kind": "md-ref"
        },
        {
          "cpt_id": "cpt-eventbackend-adr-caller-identity-blocking",
          "line": 59,
          "snippet": "### 1.2 Architecture Drivers\n\nThe architecture is driven by the three assistant capabilities, authenticated per-user access, event visibility rules, schema-valid tool contracts, safe draft behavior, and traceable conversation orchestration.\n\n**ADRs:**\n\n- `cpt-eventbackend-adr-database-migration-ordering` — Database migration ordering strategy.\n- `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons` — Suspension protection and cancellation-reason handling.\n- `cpt-eventbackend-adr-caller-identity-blocking` — Caller identity and blocking visibility.\n\nThese ADRs document decisions relevant to the architecture drivers and should be reviewed alongside this design before sign-off.",
          "marker_kind": "md-ref"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-authoritative-tool-data:p2",
          "line": 119,
          "snippet": "#### Authoritative tool data\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-authoritative-tool-data`\n\nThe assistant uses tools for authoritative event data. It must not claim that an event exists, has changed, or has been published unless the corresponding tool response confirms it.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-backend-owned-identity:p2",
          "line": 125,
          "snippet": "#### Backend-owned caller identity\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-backend-owned-identity`\n\nCaller identity and permission context are created by the backend from the verified Supabase JWT. The language model cannot create, see, or change `ToolCallContext`, and tool input schemas reject additional identity or permission properties.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-fail-closed-visibility:p2",
          "line": 131,
          "snippet": "#### Fail-closed event visibility\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-fail-closed-visibility`\n\nOnly active events whose `end_datetime` is now or in the future are visible to the assistant. Missing and hidden events produce the same `NOT_FOUND` response. Any future private or restricted visibility level remains hidden by default until this design is revised and signed off.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-human-confirmed-publish:p2",
          "line": 137,
          "snippet": "#### Human-in-the-loop event creation\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-human-confirmed-publish`\n\nDrafting is preview-only. The agent does not persist, publish, modify events, notify participants, or add the creator as a participant. Event creation occurs only after the user explicitly invokes the application publish action.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-reuse-backend-services:p2",
          "line": 143,
          "snippet": "#### Reuse existing backend business logic\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-reuse-backend-services`\n\nTool implementations wrap existing audited FastAPI endpoints and backend service functions rather than reimplementing business logic, so existing RLS, validation, coordinate checks, and rate limits remain applicable.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-principle-auditable-orchestration:p2",
          "line": 149,
          "snippet": "#### Auditable orchestration\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-principle-auditable-orchestration`\n\nAgent actions, tool invocations, and guardrail checks are recorded in `ai_agent_audit_logs`. Audit payloads may include `user_id` and tool inputs/outputs but must never include `access_token` or other credentials.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-authenticated-user-context:p2",
          "line": 157,
          "snippet": "#### Authenticated per-user execution\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-authenticated-user-context`\n\nEvery tool call requires exactly one signed-in user. A missing context or empty `user_id` returns `UNAUTHORIZED` before reading data. Tool services must use a per-request Supabase client created with the anon key and the caller's JWT so RLS applies. Tool services must never use `SUPABASE_SERVICE_KEY`.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-no-agent-db-access:p2",
          "line": 163,
          "snippet": "#### No direct agent database access\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-no-agent-db-access`\n\nThe agent has no direct database connection string, network route, or permission to execute raw PostgreSQL/Supabase queries.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-closed-tool-input:p2",
          "line": 169,
          "snippet": "#### Restricted tool input surface\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-closed-tool-input`\n\nTool input schemas use `\"additionalProperties\": false`. The model cannot pass `user_id`, `created_by`, `status`, or other identity/permission fields. The user's role, including `administrator`, grants no extra assistant access; administrative work remains in the admin panel.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-event-visibility:p2",
          "line": 175,
          "snippet": "#### Event visibility boundary\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-event-visibility`\n\nAssistant-visible events must have `status = 'active'` and `end_datetime` now or in the future. Cancelled, ended, and future restricted events are not visible. Missing and hidden event lookups return the same `NOT_FOUND` code and message.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-draft-preview-only:p2",
          "line": 181,
          "snippet": "#### Draft and publish boundary\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-draft-preview-only`\n\nDraft New Event requires a signed-in, onboarded caller, returns a preview and validation issues, and performs no persistence or publication. The user must explicitly publish through `POST /api/events/`.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-constraint-no-credential-disclosure:p2",
          "line": 187,
          "snippet": "#### Data and credential disclosure boundary\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-no-credential-disclosure`\n\nTool calls and responses must not expose service-role credentials, internal database errors, or unrestricted personal data. Error messages must not contain stack traces, SQL, table names, tokens, or other users' data. Access tokens are never logged or placed in model context.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-component-guardian-agent:p2",
          "line": 227,
          "snippet": "#### Guardian Agent\n\n- [ ] `p2` - **ID**: `cpt-eventbackend-component-guardian-agent`",
          "marker_kind": "md-def"
        },
        {

          "cpt_id": "cpt-eventbackend-seq-search-events",
          "line": 968,
          "snippet": "#### Search Events request\n\n**ID**: `cpt-eventbackend-seq-search-events`\n\n**Actors**: Signed-in user, GuardianAgent, IntentIdentifier, ToolCaller, Search Events tool, event search service, Supabase/PostgreSQL, ResponseCollector.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant UI as Chat UI\n    participant Guard as GuardianAgent\n    participant Intent as IntentIdentifier\n    participant Caller as ToolCaller\n    participant Tool as Search Events\n    participant Service as Event Search Service\n    participant DB as Supabase/PostgreSQL\n    participant Response as ResponseCollector\n\n    User->>UI: Ask to find events\n    UI->>Guard: Submit prompt\n    Guard->>Guard: Input guard\n    Guard->>Intent: Sanitized prompt and session state\n    Intent->>Intent: Identify search intent\n    Intent->>Caller: Dispatch search\n    Caller->>Tool: Input + backend ToolCallContext\n    Tool->>Service: Validated search request\n    Service->>DB: Read visible events under caller context\n    DB-->>Service: Matching event records\n    Service-->>Tool: Search result\n    Tool-->>Caller: Schema-valid output\n    Caller-->>Response: Tool result\n    Response-->>Guard: Synthesized response\n    Guard-->>UI: Guarded response\n    UI-->>User: Search results\n```\n\n**Description**: The assistant classifies a meaningful search request, executes the Search Events tool using backend caller context, and presents the schema-valid result. If the request is too ambiguous, the IntentIdentifier asks for clarification rather than issuing an unconstrained search.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-seq-get-event-details",
          "line": 1006,
          "snippet": "#### Get Event Details request\n\n**ID**: `cpt-eventbackend-seq-get-event-details`\n\n**Actors**: Signed-in user, GuardianAgent, IntentIdentifier, ToolCaller, Get Event Details tool, event details service, Supabase/PostgreSQL, ResponseCollector.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant UI as Chat UI\n    participant Guard as GuardianAgent\n    participant Intent as IntentIdentifier\n    participant Caller as ToolCaller\n    participant Tool as Get Event Details\n    participant Service as Event Details Service\n    participant DB as Supabase/PostgreSQL\n    participant Response as ResponseCollector\n\n    User->>UI: Ask about one event\n    UI->>Guard: Submit prompt\n    Guard->>Intent: Sanitized prompt and session state\n    Intent->>Caller: Dispatch details lookup\n    Caller->>Tool: Event UUID + backend ToolCallContext\n    Tool->>Service: Validated details request\n    Service->>DB: Read requested event under caller context\n    DB-->>Service: Event record or no visible record\n    Service-->>Tool: Details or NOT_FOUND\n    Tool-->>Caller: Schema-valid output\n    Caller-->>Response: Tool result\n    Response-->>Guard: Synthesized response\n    Guard-->>UI: Guarded response\n    UI-->>User: Event details or safe not-found response\n```\n\n**Description**: The details tool returns the authoritative visible event record. Missing and hidden records return the same `NOT_FOUND` response so the assistant does not confirm the existence of a hidden event.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-seq-draft-and-publish",
          "line": 1042,
          "snippet": "#### Draft and user-confirmed publish\n\n**ID**: `cpt-eventbackend-seq-draft-and-publish`\n\n**Actors**: Signed-in, onboarded user, GuardianAgent, IntentIdentifier, ToolCaller, Draft New Event tool, event draft service, ResponseCollector, application publish endpoint.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant UI as Chat UI\n    participant Guard as GuardianAgent\n    participant Intent as IntentIdentifier\n    participant Caller as ToolCaller\n    participant Tool as Draft New Event\n    participant Service as Event Draft Service\n    participant Response as ResponseCollector\n    participant Publish as POST /api/events/\n\n    User->>UI: Describe proposed event\n    UI->>Guard: Submit prompt\n    Guard->>Intent: Sanitized prompt and session state\n    Intent->>Caller: Dispatch draft\n    Caller->>Tool: Draft fields + backend ToolCallContext\n    Tool->>Service: Validate event fields\n    Service-->>Tool: Draft preview and validation issues\n    Tool-->>Caller: Schema-valid draft output\n    Caller-->>Response: Draft result\n    Response-->>Guard: Draft card response\n    Guard-->>UI: Guarded preview\n    UI-->>User: Show draft for review\n    User->>UI: Explicitly publish\n    UI->>Publish: POST /api/events/\n    Publish-->>UI: Publish response\n    UI-->>User: Application result\n```\n\n**Description**: Drafting returns a non-persisted preview. Only the user's explicit application action invokes `POST /api/events/`; the assistant does not publish the event.",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-dbtable-ai-conversations",
          "line": 1084,
          "snippet": "#### Table: `ai_conversations`\n\n**ID**: `cpt-eventbackend-dbtable-ai-conversations`\n\nRepresents an ongoing or past chat session between a user and the AI orientation assistant.\n\n| Column | Type | Constraints / Defaults | Description |\n|---|---|---|---|\n| `id` | `UUID` | `PRIMARY KEY DEFAULT gen_random_uuid()` | Unique session identifier |\n| `user_id` | `UUID` | `NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE` | Owner of the chat session |\n| `title` | `TEXT` | `DEFAULT 'New Conversation'` | Human-readable title (auto-generated from first prompt or user-edited) |\n| `context_state` | `JSONB` | `DEFAULT '{}'::jsonb` | Active entity slot cache (e.g., extracted draft fields, timezone, active filters) |\n| `created_at` | `TIMESTAMPTZ` | `NOT NULL DEFAULT NOW()` | Session creation timestamp |\n| `updated_at` | `TIMESTAMPTZ` | `NOT NULL DEFAULT NOW()` | Timestamp of last message or state update |",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-dbtable-ai-messages",
          "line": 1099,
          "snippet": "#### Table: `ai_messages`\n\n**ID**: `cpt-eventbackend-dbtable-ai-messages`\n\nStores user queries and assistant responses that are retrieved and presented in the frontend chat interface.\n\n| Column | Type | Constraints / Defaults | Description |\n|---|---|---|---|\n| `id` | `UUID` | `PRIMARY KEY DEFAULT gen_random_uuid()` | Unique message identifier |\n| `conversation_id` | `UUID` | `NOT NULL REFERENCES ai_conversations(id) ON DELETE CASCADE` | Linked session |\n| `role` | `TEXT` | `NOT NULL CHECK (role IN ('user', 'assistant', 'system'))` | Sender role |\n| `content` | `TEXT` | `NOT NULL` | Markdown-rendered textual dialogue content |\n| `metadata` | `JSONB` | `DEFAULT '{}'::jsonb` | Rich UI card payloads: draft event previews, search result lists, validation issues, tool references |\n| `created_at` | `TIMESTAMPTZ` | `NOT NULL DEFAULT NOW()` | Message timestamp |",
          "marker_kind": "md-def"
        },
        {
          "cpt_id": "cpt-eventbackend-dbtable-ai-agent-audit-logs",
          "line": 1114,
          "snippet": "#### Table: `ai_agent_audit_logs`\n\n**ID**: `cpt-eventbackend-dbtable-ai-agent-audit-logs`\n\nRecords every granular step, decision, and tool invocation made by each agent in the orchestration pipeline for transparency, debugging, and guardrail monitoring.\n\n| Column | Type | Constraints / Defaults | Description |\n|---|---|---|---|\n| `id` | `UUID` | `PRIMARY KEY DEFAULT gen_random_uuid()` | Unique log entry identifier |\n| `conversation_id` | `UUID` | `NOT NULL REFERENCES ai_conversations(id) ON DELETE CASCADE` | Linked session |\n| `message_id` | `UUID` | `REFERENCES ai_messages(id) ON DELETE SET NULL` | Linked message if applicable |\n| `user_id` | `UUID` | `REFERENCES auth.users(id) ON DELETE SET NULL` | Authenticated user making the request |\n| `agent_name` | `TEXT` | `NOT NULL` | Name of executing agent (`GuardianAgent`, `IntentIdentifier`, `ToolCaller`, `ResponseCollector`) |\n| `action_taken` | `TEXT` | `NOT NULL` | Action code (e.g., `INPUT_GUARD_PASSED`, `INPUT_GUARD_BLOCKED`, `INTENT_CLASSIFIED`, `TOOL_CALLED`, `TOOL_COMPLETED`, `OUTPUT_GUARD_PASSED`, `DRAFT_GENERATED`) |\n| `execution_payload` | `JSONB` | `DEFAULT '{}'::jsonb` | Input arguments, tool response payload, decision rationales, error traces, and execution duration (ms) |\n| `created_at` | `TIMESTAMPTZ` | `NOT NULL DEFAULT NOW()` | Action execution timestamp |",
          "marker_kind": "md-def"
        }
      ]
    },

      "refs": [
        {
          "cpt_id": "cpt-eventbackend-adr-database-migration-ordering",
          "line": 57,
          "snippet": "### 1.2 Architecture Drivers\n\nThe architecture is driven by the three assistant capabilities, authenticated per-user access, event visibility rules, schema-valid tool contracts, safe draft behavior, and traceable conversation orchestration.\n\n**ADRs:**\n\n- `cpt-eventbackend-adr-database-migration-ordering` — Database migration ordering strategy.\n- `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons` — Suspension protection and cancellation-reason handling.\n- `cpt-eventbackend-adr-caller-identity-blocking` — Caller identity and blocking visibility.\n\nThese ADRs document decisions relevant to the architecture drivers and should be reviewed alongside this design before sign-off.",
          "def_line": 25,
          "def_snippet": "**ID**: `cpt-eventbackend-adr-database-migration-ordering`\n## Context and Problem Statement\n\nA fresh database initialization fails during `supabase db push` because foundational tables (`profiles`, `events`, `friend_requests`, `friendships`, `event_chats`) were previously created manually or referenced by alteration and RLS migrations before their corresponding `CREATE TABLE` scripts ran (Issue #181). How should the project structure and order migrations so both clean fresh instances and existing environments remain fully supported and reproducible?\n\n## Decision Drivers\n\n* **Zero-Downtime / Idempotency**: Migrations must execute safely against clean developer/staging/test instances without breaking already-deployed production databases.\n* **Chronological Correctness**: Supabase CLI runs scripts lexicographically by timestamp; table definitions must precede constraint alterations and RLS activations.\n* **Developer Workflow**: Teammates must have clear guidelines and templates when submitting PRs with database scripts.\n\n## Considered Options\n\n* **Option 1: Single Squash Migration**: Delete all historical migrations and squash into a single monolithic script.\n* **Option 2: Baseline Migration + Idempotent Ordering**: Introduce `20260101000000_initial_schema.sql` for foundational tables, make `20260411120000_enable_rls.sql` resilient, ensure `20261001141815_friendship_constraints.sql` guarantees `notifications.related_user_id`, and establish team PR guidelines.\n* **Option 3: Manual SQL Execution Only**: Continue running DDL manually in Supabase Studio.\n\n## Decision Outcome\n\nChosen option: **Option 2: Baseline Migration + Idempotent Ordering**, because it preserves the full git history of past sprints, avoids destructive changes to production databases (using `IF NOT EXISTS`), and restores complete reproducibility for new developers and automated CI environments.\n\n### Consequences\n\n* **Good**: Fresh databases can boot from scratch via `supabase db push` without errors.\n* **Good**: Missing columns (`notifications.related_user_id`) are guaranteed to exist regardless of whether migrations run individually or sequentially.\n* **Good**: Existing environments are untouched because all table creations and constraint additions use idempotent guards.\n* **Bad**: Migration history contains initial base definitions alongside later modifications, requiring awareness documented in `supabase/MIGRATION_GUIDELINES.md`.\n\n### Confirmation\n\nVerified by:\n1. Lexicographical migration order inspection (`20260101000000_initial_schema.sql` runs before `20260311_add_seed_rows.sql` and `20260411120000_enable_rls.sql`).\n2. Verification of table dependencies and column availability across all migration scripts.\n3. Full backend pytest test suite passing without regression.\n\n## Pros and Cons of the Options\n\n### Option 1: Single Squash Migration\n\n* Good, because it simplifies the migration folder to 1 file.\n* Bad, because it breaks migration tracking on live Supabase databases that have already applied past migration timestamps.\n* Bad, because it erases historical context of past sprint PRs.\n\n### Option 2: Baseline Migration + Idempotent Ordering\n\n* Good, because existing environments simply skip `IF NOT EXISTS` statements without side effects.\n* Good, because new environments create tables before seeds, RLS, and constraints.\n* Good, because it completely solves Issue #181 and unblocks frontend tickets #146 and #147.\n\n## Traceability\n\n- **Issue**: [#181](https://github.com/E-VENT-Tribe-2026/event-backend/issues/181)\n- **Guidelines**: [MIGRATION_GUIDELINES.md](../../../supabase/MIGRATION_GUIDELINES.md)\n- **Task Plan**: Issue #181 Execution Plan"
        }

      "id": "cpt-1",
      "from": "local:docs/agent-tool-specification.md",

        {
          "cpt_id": "cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons",
          "line": 58,
          "snippet": "### 1.2 Architecture Drivers\n\nThe architecture is driven by the three assistant capabilities, authenticated per-user access, event visibility rules, schema-valid tool contracts, safe draft behavior, and traceable conversation orchestration.\n\n**ADRs:**\n\n- `cpt-eventbackend-adr-database-migration-ordering` — Database migration ordering strategy.\n- `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons` — Suspension protection and cancellation-reason handling.\n- `cpt-eventbackend-adr-caller-identity-blocking` — Caller identity and blocking visibility.\n\nThese ADRs document decisions relevant to the architecture drivers and should be reviewed alongside this design before sign-off.",
          "def_line": 25,
          "def_snippet": "**ID**: `cpt-eventbackend-adr-suspension-protection-and-cancellation-reasons`\n## Context and Problem Statement\n\nThe implementation for issues #189, #191, and #192 introduced `suspended_at`, `suspension_reason`, `admin_since`, and `cancellation_reason`, but left three critical gaps (Issue #232):\n1. **Suspension Bypass**: Authenticated users could issue direct `UPDATE public.profiles` statements to clear their own `suspended_at` and `suspension_reason` or forge `admin_since` because the existing trigger checked only `role`.\n2. **Missing `admin_since`**: Existing administrators and users promoted directly in the database remained with `admin_since = NULL`.\n3. **Missing `cancellation_reason`**: Events cancelled before the migration or cancelled through the organizer API (`POST /api/events/{event_id}/cancel`) recorded `cancellation_reason = NULL`.\n\nHow should the database and backend prevent suspension bypasses and guarantee complete administrator dates and cancellation reasons?\n\n## Decision Drivers\n\n* **Security & Non-Bypassability**: Ordinary users must never be able to alter administrative fields (`suspended_at`, `suspension_reason`, `admin_since`) via direct database client updates.\n* **Auditability & Completeness**: Every cancelled event must carry an explicit reason, distinguishing organizer cancellations from administrator promotions or account suspensions.\n* **Seamless Automation**: Promoting a user to administrator directly in PostgreSQL must automatically assign `admin_since` without manual intervention or accidental resets during routine profile edits.\n\n## Considered Options\n\n* **Option 1: Backend-Only Checks**: Enforce checks exclusively in the FastAPI service layer.\n* **Option 2: Database Triggers + Backend Defense-in-Depth**:\n  - Upgrade `protect_profile_role()` to validate `suspended_at`, `suspension_reason`, and `admin_since` when `auth.role() = 'authenticated'`.\n  - Automatically manage `admin_since` during role transitions and preserve it during unrelated updates.\n  - Backfill existing administrators with the rollout date (`2026-10-21T12:00:00Z`).\n  - Backfill previously cancelled events with `'Cancelled by organizer'`.\n  - Add database trigger and backend updates in `event_service.py` to persist `'Cancelled by organizer'`.\n\n## Decision Outcome\n\nChosen option: **Option 2: Database Triggers + Backend Defense-in-Depth**, because Supabase client APIs allow authenticated requests directly to PostgREST. Enforcing restrictions at the database trigger layer prevents bypass regardless of whether updates originate from the backend API or direct client queries.\n\n### Consequences\n\n* **Good**: Suspended accounts cannot clear their suspension or elevate their privileges.\n* **Good**: Assigning `role = 'administrator'` automatically records `admin_since` and preserves it on profile updates.\n* **Good**: All cancelled events have a clear, non-null `cancellation_reason`.\n* **Good**: Ordinary users can still edit their own allowed profile fields (`full_name`, `bio`, `avatar_url`, `interests`, etc.) without interference.\n* **Bad**: Slight trigger overhead on profile updates, which is negligible for user traffic.\n\n### Confirmation\n\nVerified by:\n1. Scenario testing verifying that authenticated direct updates to `suspended_at`, `suspension_reason`, or `admin_since` raise exceptions.\n2. Promoting users directly in the database sets `admin_since` automatically.\n3. Organizer cancellation via `/api/events/{event_id}/cancel` persists `\"Cancelled by organizer\"`.\n4. Full test suite passing with zero regressions.\n\n## Pros and Cons of the Options\n\n### Option 1: Backend-Only Checks\n\n* Good: Simple to implement in Python.\n* Bad: Completely ineffective against authenticated users communicating directly with Supabase via PostgREST.\n\n### Option 2: Database Triggers + Backend Defense-in-Depth\n\n* Good: Enforces hard database constraints at the row level.\n* Good: Transparent to backend services using service role permissions.\n* Good: Completely resolves all three scenarios outlined in Issue #232.\n\n## Traceability\n\n- **Issue**: [#232](https://github.com/E-VENT-Tribe-2026/event-backend/issues/232)\n- **Related Issues**: [#189](https://github.com/E-VENT-Tribe-2026/event-backend/issues/189), [#191](https://github.com/E-VENT-Tribe-2026/event-backend/issues/191), [#192](https://github.com/E-VENT-Tribe-2026/event-backend/issues/192)\n- **Migration**: [20261027120000_fix_suspension_bypass_and_cancellation_reasons.sql](../../../supabase/migrations/20261027120000_fix_suspension_bypass_and_cancellation_reasons.sql)\n- **Code**: [event_service.py](../../../app/services/event_service.py)"
        }

          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-get-event-details-tool`\n##### Why this component exists\n\nThe assistant needs authoritative detail for one event when search summaries do not contain enough information to answer a detailed question.\n\n##### Responsibility scope\n\nAccepts exactly one UUID and returns the current authoritative record for a visible event, including the defined event fields and nullable values.\n\n##### Responsibility boundaries\n\nDoes not reveal whether a missing or hidden event exists. It returns the same `NOT_FOUND` code and message for missing, ended, cancelled, or future restricted events.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-tool-caller` — dispatches the tool.\n- `cpt-eventbackend-component-search-events-tool` — supplies event identifiers from search results.\n- `cpt-eventbackend-component-conversation-state-store` — records invocation telemetry."

          "snippet": "# @cpt-flow:cpt-eventbackend-component-draft-new-event-tool:p1\n@router.post(\"/tools/draft-event\", response_model=DraftNewEventResponse)\ndef draft_event_tool(body: Any = Body(...), user=Depends(require_regular_user)):\n    return draft_new_event(body, getattr(user, \"id\", None))",
          "def_line": 389,
          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-draft-new-event-tool`\n##### Why this component exists\n\nThe assistant needs to help a user formulate a new event while keeping validation and final publication under backend and user control.\n\n##### Responsibility scope\n\nAccepts event fields, validates required fields, date ordering, timezone, cost, capacity, and coordinates, and returns a draft preview with validation issues.\n\n##### Responsibility boundaries\n\nDoes not persist, publish, notify participants, add the creator as a participant, silently replace invalid/missing values, or read event data from the database. The user's explicit application publish action creates the event.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-tool-caller` — dispatches the tool.\n- `cpt-eventbackend-component-response-collector` — presents the draft preview.\n- `cpt-eventbackend-component-conversation-state-store` — records invocation telemetry.\n- `cpt-eventbackend-component-publish-endpoint` — user-triggered publish path, not an agent tool."

          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-constraint-authenticated-user-context`\nEvery tool call requires exactly one signed-in user. A missing context or empty `user_id` returns `UNAUTHORIZED` before reading data. Tool services must use a per-request Supabase client created with the anon key and the caller's JWT so RLS applies. Tool services must never use `SUPABASE_SERVICE_KEY`."

          "snippet": "# @cpt-comp:cpt-eventbackend-component-response-collector:p1\ndef generate_reply(\n    messages: list[AssistantMessage],\n    user_id: Optional[str] = None,\n    draft: Optional[dict] = None,",
          "def_line": 296,
          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-response-collector`\n##### Why this component exists\n\nTool results, FAQ responses, and clarification responses need to be synthesized into user-facing conversational output.\n\n##### Responsibility scope\n\nCollects ToolCaller output or direct IntentIdentifier responses, synthesizes a helpful response, and presents draft cards to the user for human-in-the-loop publishing.\n\n##### Responsibility boundaries\n\nDoes not treat unconfirmed tool results as authoritative, modify event data, or publish a draft. The source does not define a specific response-rendering technology.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-tool-caller` — provides tool results.\n- `cpt-eventbackend-component-intent-identifier` — provides FAQ/clarification responses.\n- `cpt-eventbackend-component-guardian-agent` — output guardrail.\n- `cpt-eventbackend-component-conversation-state-store` — conversation and action records."

    {
      "id": "cpt-15",
      "from": "local:app/services/block_visibility.py",
      "to": "local:architecture/ADR/0001-caller-identity-and-blocking-visibility.md",
      "type": "cpt-impl",
      "refs": [
        {
          "cpt_id": "cpt-eventbackend-adr-caller-identity-blocking:p1",
          "line": 147,
          "snippet": "# @cpt-adr:cpt-eventbackend-adr-caller-identity-blocking:p1\ndef is_event_hidden(event: dict, viewer_id: str | None) -> bool:\n    \"\"\"True when a single event row must be treated as not found for the viewer.\"\"\"\n    return bool(event) and bool(viewer_id) and not filter_hidden_events([event], viewer_id)\n",
          "def_line": 24,
          "def_snippet": "**ID**: `cpt-eventbackend-adr-caller-identity-blocking`\n## Context and Problem Statement\n\n`POST /api/assistant/tools/search-events` and `POST /api/assistant/chat` authenticated incoming requests via JWT dependencies (`get_current_user`), but did not forward the caller's identity (`user.id` or user metadata) to the underlying services. As reported in Issue #225, this allowed events organized by users who blocked the caller (or whom the caller blocked) to remain visible through assistant search. Additionally, conversational responses lacked caller personalization.\n\nHow should assistant endpoints propagate caller context to enforce blocking rules and provide personalized responses without violating data access boundaries?\n\n## Decision Drivers\n\n* **Privacy & Safety**: Event visibility must strictly enforce bidirectional user blocking rules (#184, #225).\n* **Architecture Compliance**: Assistant chat must not query Supabase tables directly (`test_assistant_chat_does_not_query_supabase_tables`).\n* **Personalization**: LLM responses should tailor suggestions to the authenticated user's name and interests.\n* **Compatibility**: Maintain strict adherence to `docs/agent-tool-specification.md`.\n\n## Considered Options\n\n* **Option 1: Rely on route-level authentication without service propagation** (Existing behavior — rejected due to Issue #225 leak).\n* **Option 2: Query database profiles during chat** (Rejected — violates requirement that chat does not query database tables).\n* **Option 3: Forward caller ID to search service and inject minimal user metadata from verified JWT into assistant prompt** (Chosen).\n\n## Decision Outcome\n\nChosen option: **Option 3**, because:\n1. `search_events(payload, viewer_id)` already implemented `hidden_events_filter(viewer_id)` based on Issue #184 blocking rules; passing `getattr(user, \"id\", None)` immediately enforces the policy.\n2. Extracting minimal, non-sensitive identity metadata (`id`, `name`, `username`, `interests`) from the verified `user` object provides LLM personalization without any database table queries.\n\n### Consequences\n\n* **Good**: Blocked organizers' events are properly omitted from Assistant search results, while existing-participation exceptions are honored.\n* **Good**: The assistant greets users by name and tailors responses according to their metadata without additional network latency or database load.\n* **Good**: All automated tests pass without regressions.\n\n### Confirmation\n\n* Verified via unit and integration tests:\n  - `tests/test_event_search.py::test_search_forwards_authenticated_user_id`\n  - `tests/test_blocking.py::test_assistant_search_events_endpoint_respects_blocking`\n  - `tests/test_assistant_routes.py::test_assistant_chat_includes_minimal_user_context_in_prompt`\n* Verified via live API testing with authenticated account `kalebteshale72@gmail.com`.\n\n## Pros and Cons of the Options\n\n### Option 3 (Chosen: Forward caller ID and minimal JWT user context)\n\n* Good, because closes the security leak in #225.\n* Good, because respects the design rule against querying database tables during chat.\n* Neutral, because prompt size increases slightly to include minimal user context.\n\n## Traceability\n\n- **Specification**: [agent-tool-specification.md](../../docs/agent-tool-specification.md)\n- **Issues Addressed**:\n  * [#225](https://github.com/E-VENT-Tribe-2026/event-backend/issues/225) — Blocked organizers' events remain visible through Assistant search\n  * User context personalization for assistant chat"
        }
      ],
      "cross_repo": false,
      "dangling": false

          "snippet": "# @cpt-adr:cpt-eventbackend-adr-caller-identity-blocking:p1\ndef get_event_details(payload: Any, user_id: Optional[str]) -> dict:\n    request_id = str(uuid.uuid4())\n    if not isinstance(user_id, str) or not user_id.strip():\n        return _failure(request_id, \"UNAUTHORIZED\", \"Authentication is required.\", None)",
          "def_line": 24,
          "def_snippet": "**ID**: `cpt-eventbackend-adr-caller-identity-blocking`\n## Context and Problem Statement\n\n`POST /api/assistant/tools/search-events` and `POST /api/assistant/chat` authenticated incoming requests via JWT dependencies (`get_current_user`), but did not forward the caller's identity (`user.id` or user metadata) to the underlying services. As reported in Issue #225, this allowed events organized by users who blocked the caller (or whom the caller blocked) to remain visible through assistant search. Additionally, conversational responses lacked caller personalization.\n\nHow should assistant endpoints propagate caller context to enforce blocking rules and provide personalized responses without violating data access boundaries?\n\n## Decision Drivers\n\n* **Privacy & Safety**: Event visibility must strictly enforce bidirectional user blocking rules (#184, #225).\n* **Architecture Compliance**: Assistant chat must not query Supabase tables directly (`test_assistant_chat_does_not_query_supabase_tables`).\n* **Personalization**: LLM responses should tailor suggestions to the authenticated user's name and interests.\n* **Compatibility**: Maintain strict adherence to `docs/agent-tool-specification.md`.\n\n## Considered Options\n\n* **Option 1: Rely on route-level authentication without service propagation** (Existing behavior — rejected due to Issue #225 leak).\n* **Option 2: Query database profiles during chat** (Rejected — violates requirement that chat does not query database tables).\n* **Option 3: Forward caller ID to search service and inject minimal user metadata from verified JWT into assistant prompt** (Chosen).\n\n## Decision Outcome\n\nChosen option: **Option 3**, because:\n1. `search_events(payload, viewer_id)` already implemented `hidden_events_filter(viewer_id)` based on Issue #184 blocking rules; passing `getattr(user, \"id\", None)` immediately enforces the policy.\n2. Extracting minimal, non-sensitive identity metadata (`id`, `name`, `username`, `interests`) from the verified `user` object provides LLM personalization without any database table queries.\n\n### Consequences\n\n* **Good**: Blocked organizers' events are properly omitted from Assistant search results, while existing-participation exceptions are honored.\n* **Good**: The assistant greets users by name and tailors responses according to their metadata without additional network latency or database load.\n* **Good**: All automated tests pass without regressions.\n\n### Confirmation\n\n* Verified via unit and integration tests:\n  - `tests/test_event_search.py::test_search_forwards_authenticated_user_id`\n  - `tests/test_blocking.py::test_assistant_search_events_endpoint_respects_blocking`\n  - `tests/test_assistant_routes.py::test_assistant_chat_includes_minimal_user_context_in_prompt`\n* Verified via live API testing with authenticated account `kalebteshale72@gmail.com`.\n\n## Pros and Cons of the Options\n\n### Option 3 (Chosen: Forward caller ID and minimal JWT user context)\n\n* Good, because closes the security leak in #225.\n* Good, because respects the design rule against querying database tables during chat.\n* Neutral, because prompt size increases slightly to include minimal user context.\n\n## Traceability\n\n- **Specification**: [agent-tool-specification.md](../../docs/agent-tool-specification.md)\n- **Issues Addressed**:\n  * [#225](https://github.com/E-VENT-Tribe-2026/event-backend/issues/225) — Blocked organizers' events remain visible through Assistant search\n  * User context personalization for assistant chat"
        }

          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-tool-caller`\n##### Why this component exists\n\nTool execution is separated from intent classification and response synthesis so that the assistant's event operations pass through defined backend tool contracts.\n\n##### Responsibility scope\n\nDispatches and executes Search Events, Get Event Details, or Draft New Event against backend service functions. Tool calls use the backend-created `ToolCallContext` and the input/output schemas defined in API Contracts.\n\n##### Responsibility boundaries\n\nDoes not directly query PostgreSQL/Supabase, use `SUPABASE_SERVICE_KEY`, create caller identity from model output, or persist/publish drafted events. It delegates business logic to existing backend services.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-intent-identifier` — provides classified tool intent.\n- `cpt-eventbackend-component-search-events-tool` — search capability.\n- `cpt-eventbackend-component-get-event-details-tool` — detail capability.\n- `cpt-eventbackend-component-draft-new-event-tool` — draft capability.\n- `cpt-eventbackend-component-conversation-state-store` — action and tool telemetry is persisted."
        }
      ],
      "cross_repo": false,
      "dangling": false

    {
      "id": "cpt-4",
      "from": "local:app/agents/graph.py",
      "to": "local:architecture/ADR/0001-caller-identity-and-blocking-visibility.md",
      "type": "cpt-impl",
      "refs": [
        {
          "cpt_id": "cpt-eventbackend-adr-caller-identity-blocking:p1",
          "line": 36,
          "snippet": "# @cpt-adr:cpt-eventbackend-adr-caller-identity-blocking:p1\ndef tools_node(state: AgentState) -> AgentState:\n    \"\"\"Execute deterministic backend tools per specification.\"\"\"\n    tool_name = state.get(\"tool_name\")\n    # The signed-in user comes from the request, never from what the model put in the tool input.",
          "def_line": 24,
          "def_snippet": "**ID**: `cpt-eventbackend-adr-caller-identity-blocking`\n## Context and Problem Statement\n\n`POST /api/assistant/tools/search-events` and `POST /api/assistant/chat` authenticated incoming requests via JWT dependencies (`get_current_user`), but did not forward the caller's identity (`user.id` or user metadata) to the underlying services. As reported in Issue #225, this allowed events organized by users who blocked the caller (or whom the caller blocked) to remain visible through assistant search. Additionally, conversational responses lacked caller personalization.\n\nHow should assistant endpoints propagate caller context to enforce blocking rules and provide personalized responses without violating data access boundaries?\n\n## Decision Drivers\n\n* **Privacy & Safety**: Event visibility must strictly enforce bidirectional user blocking rules (#184, #225).\n* **Architecture Compliance**: Assistant chat must not query Supabase tables directly (`test_assistant_chat_does_not_query_supabase_tables`).\n* **Personalization**: LLM responses should tailor suggestions to the authenticated user's name and interests.\n* **Compatibility**: Maintain strict adherence to `docs/agent-tool-specification.md`.\n\n## Considered Options\n\n* **Option 1: Rely on route-level authentication without service propagation** (Existing behavior — rejected due to Issue #225 leak).\n* **Option 2: Query database profiles during chat** (Rejected — violates requirement that chat does not query database tables).\n* **Option 3: Forward caller ID to search service and inject minimal user metadata from verified JWT into assistant prompt** (Chosen).\n\n## Decision Outcome\n\nChosen option: **Option 3**, because:\n1. `search_events(payload, viewer_id)` already implemented `hidden_events_filter(viewer_id)` based on Issue #184 blocking rules; passing `getattr(user, \"id\", None)` immediately enforces the policy.\n2. Extracting minimal, non-sensitive identity metadata (`id`, `name`, `username`, `interests`) from the verified `user` object provides LLM personalization without any database table queries.\n\n### Consequences\n\n* **Good**: Blocked organizers' events are properly omitted from Assistant search results, while existing-participation exceptions are honored.\n* **Good**: The assistant greets users by name and tailors responses according to their metadata without additional network latency or database load.\n* **Good**: All automated tests pass without regressions.\n\n### Confirmation\n\n* Verified via unit and integration tests:\n  - `tests/test_event_search.py::test_search_forwards_authenticated_user_id`\n  - `tests/test_blocking.py::test_assistant_search_events_endpoint_respects_blocking`\n  - `tests/test_assistant_routes.py::test_assistant_chat_includes_minimal_user_context_in_prompt`\n* Verified via live API testing with authenticated account `kalebteshale72@gmail.com`.\n\n## Pros and Cons of the Options\n\n### Option 3 (Chosen: Forward caller ID and minimal JWT user context)\n\n* Good, because closes the security leak in #225.\n* Good, because respects the design rule against querying database tables during chat.\n* Neutral, because prompt size increases slightly to include minimal user context.\n\n## Traceability\n\n- **Specification**: [agent-tool-specification.md](../../docs/agent-tool-specification.md)\n- **Issues Addressed**:\n  * [#225](https://github.com/E-VENT-Tribe-2026/event-backend/issues/225) — Blocked organizers' events remain visible through Assistant search\n  * User context personalization for assistant chat"
        }
      ],
      "cross_repo": false,
      "dangling": false
    },

          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-intent-identifier`\n##### Why this component exists\n\nThe assistant must distinguish requests requiring event tools from general product questions and ambiguous requests that need clarification.\n\n##### Responsibility scope\n\nAnalyzes the sanitized user prompt and session state to classify intent as tool calling, normal LLM response (FAQ/navigation guidance), or more-information asking.\n\n##### Responsibility boundaries\n\nDoes not execute backend tools; tool execution is delegated to `ToolCaller`. It does not bypass the requirement to clarify ambiguous searches.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-guardian-agent` — receives sanitized input.\n- `cpt-eventbackend-component-tool-caller` — receives tool-call intent.\n- `cpt-eventbackend-component-response-collector` — may provide direct FAQ/clarification responses.\n- `cpt-eventbackend-component-conversation-state-store` — uses shared session state."

          "def_line": 296,
          "def_snippet": "- [ ] `p2` - **ID**: `cpt-eventbackend-component-response-collector`\n##### Why this component exists\n\nTool results, FAQ responses, and clarification responses need to be synthesized into user-facing conversational output.\n\n##### Responsibility scope\n\nCollects ToolCaller output or direct IntentIdentifier responses, synthesizes a helpful response, and presents draft cards to the user for human-in-the-loop publishing.\n\n##### Responsibility boundaries\n\nDoes not treat unconfirmed tool results as authoritative, modify event data, or publish a draft. The source does not define a specific response-rendering technology.\n\n##### Related components (by ID)\n\n- `cpt-eventbackend-component-tool-caller` — provides tool results.\n- `cpt-eventbackend-component-intent-identifier` — provides FAQ/clarification responses.\n- `cpt-eventbackend-component-guardian-agent` — output guardrail.\n- `cpt-eventbackend-component-conversation-state-store` — conversation and action records."
